# Ingress — маршрутизация внешнего трафика (ВКР §2.4, Листинг 8).
# /api и /socket.io → backend (3050), остальное → frontend (80).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cian-lead-generator
  namespace: cian-lead-generator
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3050
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3050
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
