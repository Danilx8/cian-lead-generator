# Redis (с модулем RedisJSON) — Pub/Sub-шина и кэш (ВКР §2.4, Листинг 8).
# Имя сервиса 'redis' совпадает с REDIS_HOST приложения.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cian-lead-generator
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: klein-redis-rejson:latest
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cian-lead-generator-secrets
                  key: REDIS_USERNAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cian-lead-generator-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cian-lead-generator
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
