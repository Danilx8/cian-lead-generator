# Frontend — React-клиент (ВКР §2.4, Листинг 8).
# Код фронтенда находится в отдельном репозитории; здесь — только манифест развёртывания
# собранного образа, раздающего статику на порту 80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cian-lead-generator
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/cian-lead/frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cian-lead-generator
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
